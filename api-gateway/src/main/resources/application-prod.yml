server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**, /api/users/**, /api/admin/users/**
          filters:
            - JwtAuthFilter

        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/api/posts/**, /api/admin/posts/**
          filters:
            - JwtAuthFilter

        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/comments/**, /api/admin/comments/**
          filters:
            - JwtAuthFilter

        - id: category-tag-service
          uri: lb://category-tag-service
          predicates:
            - Path=/api/categories/**, /api/tags/**
          filters:
            - JwtAuthFilter

        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/media/**
          filters:
            - JwtAuthFilter

        - id: newsletter-service
          uri: lb://newsletter-service
          predicates:
            - Path=/api/newsletter/**, /api/admin/newsletter/**
          filters:
            - JwtAuthFilter

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**, /ws/**
          filters:
            - JwtAuthFilter

        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/analytics/**
          filters:
            - JwtAuthFilter

        # Swagger UI pass-through routes (no JWT filter)
        - id: auth-service-swagger
          uri: lb://auth-service
          predicates:
            - Path=/docs/auth-service/v3/api-docs
          filters:
            - RewritePath=/docs/auth-service/(?<segment>.*), /${segment}

        - id: post-service-swagger
          uri: lb://post-service
          predicates:
            - Path=/docs/post-service/v3/api-docs
          filters:
            - RewritePath=/docs/post-service/(?<segment>.*), /${segment}

        - id: comment-service-swagger
          uri: lb://comment-service
          predicates:
            - Path=/docs/comment-service/v3/api-docs
          filters:
            - RewritePath=/docs/comment-service/(?<segment>.*), /${segment}

        - id: category-tag-service-swagger
          uri: lb://category-tag-service
          predicates:
            - Path=/docs/category-tag-service/v3/api-docs
          filters:
            - RewritePath=/docs/category-tag-service/(?<segment>.*), /${segment}

        - id: media-service-swagger
          uri: lb://media-service
          predicates:
            - Path=/docs/media-service/v3/api-docs
          filters:
            - RewritePath=/docs/media-service/(?<segment>.*), /${segment}

        - id: newsletter-service-swagger
          uri: lb://newsletter-service
          predicates:
            - Path=/docs/newsletter-service/v3/api-docs
          filters:
            - RewritePath=/docs/newsletter-service/(?<segment>.*), /${segment}

        - id: notification-service-swagger
          uri: lb://notification-service
          predicates:
            - Path=/docs/notification-service/v3/api-docs
          filters:
            - RewritePath=/docs/notification-service/(?<segment>.*), /${segment}

        - id: analytics-service-swagger
          uri: lb://analytics-service
          predicates:
            - Path=/docs/analytics-service/v3/api-docs
          filters:
            - RewritePath=/docs/analytics-service/(?<segment>.*), /${segment}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:inkwell-super-secret-jwt-key-must-be-256-bits-long-here}

logging:
  level:
    org.springframework.cloud.gateway: INFO
